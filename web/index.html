<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Reference default. connect-src 'self' keeps every fetch on this origin;
       'wasm-unsafe-eval' lets the page compile its own WebAssembly module;
       form-action 'none' blocks form posts. The simulated network is values
       in the core and cannot reach a real one. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Packet Alley</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-ready="false" data-mode="loading">
  <!-- Packet glyphs. Each type is told apart four ways, none of them colour
       alone: a distinct outline shape, a fill pattern that survives greyscale,
       a letter, and a colour. app.js references these by id with <use>; the
       map and the legend draw the very same glyph, so they always agree. All
       geometry lives here (the page JavaScript holds no number but 0 and 1). -->
  <svg id="glyphs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="pat-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="7" height="7" fill="none"></rect>
        <line x1="0" y1="0" x2="0" y2="7" stroke="#1c1020" stroke-width="3" stroke-opacity="0.42"></line>
      </pattern>
      <pattern id="pat-dots" width="8" height="8" patternUnits="userSpaceOnUse">
        <circle cx="2.5" cy="2.5" r="1.7" fill="#1c1020" fill-opacity="0.5"></circle>
      </pattern>
      <pattern id="pat-grid" width="9" height="9" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="4.5" height="4.5" fill="#1c1020" fill-opacity="0.34"></rect>
        <rect x="4.5" y="4.5" width="4.5" height="4.5" fill="#1c1020" fill-opacity="0.34"></rect>
      </pattern>

      <!-- glyph bodies, centred on (0,0); used directly on the map -->
      <g id="pkt-data">
        <circle r="19" fill="#0072b2" stroke="#2a1830" stroke-width="3"></circle>
        <text class="pkt-letter" x="0" y="1">D</text>
      </g>
      <g id="pkt-ping">
        <polygon points="0,-20 18,14 -18,14" fill="#56b4e9" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <text class="pkt-letter" x="0" y="6">P</text>
      </g>
      <g id="pkt-reply">
        <polygon points="0,20 18,-14 -18,-14" fill="#009e73" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <text class="pkt-letter" x="0" y="-5">R</text>
      </g>
      <g id="pkt-broadcast">
        <polygon points="0,-21 21,0 0,21 -21,0" fill="#e69f00" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <polygon points="0,-21 21,0 0,21 -21,0" fill="url(#pat-grid)"></polygon>
        <text class="pkt-letter" x="0" y="1">B</text>
      </g>
      <g id="pkt-arp">
        <polygon points="0,-20 19,-6 12,19 -12,19 -19,-6" fill="#cc79a7" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <polygon points="0,-20 19,-6 12,19 -12,19 -19,-6" fill="url(#pat-dots)"></polygon>
        <text class="pkt-letter" x="0" y="3">A</text>
      </g>
      <g id="pkt-syn">
        <polygon points="-17,-15 5,-15 20,0 5,15 -17,15" fill="#d55e00" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <text class="pkt-letter" x="-1" y="1">S</text>
      </g>
      <g id="pkt-synack">
        <polygon points="-17,-15 5,-15 20,0 5,15 -17,15" fill="#f0e442" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <polygon points="-17,-15 5,-15 20,0 5,15 -17,15" fill="url(#pat-hatch)"></polygon>
        <text class="pkt-letter pkt-letter--sm" x="-1" y="1">SA</text>
      </g>
      <g id="pkt-ack">
        <rect x="-17" y="-17" width="34" height="34" rx="4" fill="#7a6a74" stroke="#2a1830" stroke-width="3"></rect>
        <text class="pkt-letter" x="0" y="1">K</text>
      </g>
      <g id="pkt-seg">
        <polygon points="0,-21 18,-10 18,11 0,21 -18,11 -18,-10" fill="#0072b2" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <polygon points="0,-21 18,-10 18,11 0,21 -18,11 -18,-10" fill="url(#pat-hatch)"></polygon>
        <text class="pkt-letter" x="0" y="1">G</text>
      </g>
      <g id="pkt-rst">
        <polygon points="8,-20 20,-8 20,8 8,20 -8,20 -20,8 -20,-8 -8,-20" fill="#2a1830" stroke="#2a1830" stroke-width="3" stroke-linejoin="round"></polygon>
        <text class="pkt-letter pkt-letter--light" x="0" y="1">X</text>
      </g>

      <!-- The badge that marks an editable spot on the map (a device, a
           waiting packet, a cable). All its geometry lives here, so app.js
           only places it at a point the core returns. -->
      <g id="edit-mark">
        <circle cx="34" cy="-34" r="19" fill="#d55e00" stroke="#2a1830" stroke-width="3"></circle>
        <text class="edit-glyph" x="34" y="-33">&#9998;</text>
      </g>

      <!-- the same glyphs wrapped with a viewBox, for the legend chips -->
      <symbol id="pkt-sym-data" viewBox="-23 -23 46 46"><use href="#pkt-data"></use></symbol>
      <symbol id="pkt-sym-ping" viewBox="-23 -23 46 46"><use href="#pkt-ping"></use></symbol>
      <symbol id="pkt-sym-reply" viewBox="-23 -23 46 46"><use href="#pkt-reply"></use></symbol>
      <symbol id="pkt-sym-broadcast" viewBox="-23 -23 46 46"><use href="#pkt-broadcast"></use></symbol>
      <symbol id="pkt-sym-arp" viewBox="-23 -23 46 46"><use href="#pkt-arp"></use></symbol>
      <symbol id="pkt-sym-syn" viewBox="-23 -23 46 46"><use href="#pkt-syn"></use></symbol>
      <symbol id="pkt-sym-synack" viewBox="-23 -23 46 46"><use href="#pkt-synack"></use></symbol>
      <symbol id="pkt-sym-ack" viewBox="-23 -23 46 46"><use href="#pkt-ack"></use></symbol>
      <symbol id="pkt-sym-seg" viewBox="-23 -23 46 46"><use href="#pkt-seg"></use></symbol>
      <symbol id="pkt-sym-rst" viewBox="-23 -23 46 46"><use href="#pkt-rst"></use></symbol>
    </defs>
  </svg>

  <header id="topbar">
    <button id="home-btn" class="ghost" type="button" hidden>&#8592; Levels</button>
    <h1 id="brand">Packet Alley</h1>
    <div class="spacer"></div>
    <span id="star-count" class="star-count"></span>
    <button id="how-btn" class="ghost" type="button">How to read the map</button>
  </header>

  <main id="main">
    <!-- menu: chapters and levels -->
    <section id="menu" class="screen" hidden>
      <p id="menu-intro" class="intro"></p>
      <div id="chapters"></div>
      <div class="menu-foot">
        <label class="switch"><input id="teacher" type="checkbox"> <span id="teacher-label"></span></label>
        <button id="reset-btn" class="ghost danger" type="button"></button>
      </div>
    </section>

    <!-- level: brief + map -->
    <section id="level" class="screen" hidden>
      <div class="level-grid">
        <aside id="brief" class="brief">
          <p id="l-chapter" class="eyebrow"></p>
          <h2 id="l-title"></h2>
          <p id="l-note" class="note-badge" hidden></p>
          <p id="l-story"></p>
          <h3 id="task-h"></h3>
          <p id="l-task"></p>
          <h3 id="concept-h"></h3>
          <ul id="l-concept"></ul>
          <!-- A short verbatim passage from the open networking textbook
               (CC BY-SA 3.0), with attribution. -->
          <div id="l-textbook" class="textbook" hidden>
            <h3 id="textbook-h"></h3>
            <p id="l-textbook-text"></p>
            <p id="l-textbook-src" class="textbook-src"></p>
          </div>
          <h3 id="goals-h"></h3>
          <ul id="l-goals" class="goals"></ul>
          <p id="l-bonus" class="bonus"></p>
          <div class="edits-head">
            <h3 id="edits-h"></h3>
            <button id="panel-toggle" class="ghost small" type="button" aria-expanded="true"></button>
          </div>
          <p id="edits-hint" class="edits-hint"></p>
          <div id="l-edits" class="edits"></div>
          <div class="legend-row">
            <h3 id="legend-h"></h3>
            <div id="legend" class="legend"></div>
          </div>
        </aside>

        <div class="stage">
          <!-- Shown when the student is picking a destination by pointing at a
               machine on the map; it never covers the map itself. -->
          <p id="map-hint" class="map-hint" hidden></p>
          <div id="map-wrap" class="map-wrap">
            <div id="map-inner" class="map-inner">
              <img id="backdrop" class="backdrop" alt="" aria-hidden="true">
              <svg id="map" class="map" role="img" aria-label="network map"></svg>
            </div>
          </div>
          <!-- The on-map chooser: click an edit badge (or a highlighted
               machine) and this popover offers the choices for that spot. It
               is the same choices the side panel holds, on the map. -->
          <div id="chooser" class="chooser" role="dialog" aria-label="Choices" hidden>
            <button id="chooser-close" class="chooser-close ghost" type="button" aria-label="Close">&#10005;</button>
            <div id="chooser-body"></div>
          </div>
          <!-- Map zoom for accessibility. The slider drives a CSS variable
               (--zoom) that scales the map and its backdrop together; the
               wrap scrolls when the map is larger than its frame. Every zoom
               number lives in HTML attributes and CSS, never in app.js, which
               only reads the slider's value and calls stepUp()/stepDown(). -->
          <div id="zoom-row" class="zoom-row">
            <span id="zoom-h" class="zoom-h"></span>
            <button id="zoom-out" class="ctl zoom-btn" type="button">&#8722;</button>
            <input id="zoom" class="zoom-range" type="range" min="1" max="3" step="0.2" value="1">
            <button id="zoom-in" class="ctl zoom-btn" type="button">&#43;</button>
            <button id="zoom-reset" class="ctl zoom-btn" type="button"></button>
          </div>
          <!-- The action area, kept on the right by the map so the commit
               button is in view without scrolling. Evidence-first prediction
               (Phase 2) shows only for a migrated level. -->
          <div id="action" class="action">
            <div id="l-predict" class="predict" hidden>
              <h3 id="predict-h"></h3>
              <p id="predict-hint" class="edits-hint"></p>
              <p id="predict-prompt" class="prompt"></p>
              <div id="predict-opts" class="opts"></div>
            </div>
            <div class="run-row">
              <button id="run-btn" class="primary" type="button"></button>
              <p id="commit-hint" class="commit-hint" hidden></p>
            </div>
          </div>
          <div id="hud" class="hud" hidden></div>
          <div id="controls" class="controls" hidden>
            <button id="play-btn" class="ctl" type="button"></button>
            <button id="speed-btn" class="ctl" type="button"></button>
            <button id="skip-btn" class="ctl" type="button"></button>
            <button id="replay-btn" class="ctl" type="button"></button>
          </div>
          <!-- The step-by-step log. It can be searched, filtered by machine
               and by what happened, blown up to full screen, and collapsed.
               Every control's text comes from copy; no sizing lives here. -->
          <section id="log-panel" class="log-panel">
            <div class="log-head">
              <h3 id="log-h"></h3>
              <div class="log-head-btns">
                <button id="log-full-btn" class="ghost small" type="button"></button>
                <button id="log-toggle-btn" class="ghost small" type="button" aria-expanded="true"></button>
              </div>
            </div>
            <div id="log-tools" class="log-tools">
              <input id="log-search" class="log-search" type="search">
              <div class="log-filter-group">
                <span id="log-by-action" class="log-filter-label"></span>
                <div id="log-kinds" class="log-chips"></div>
              </div>
              <div class="log-filter-group">
                <span id="log-by-machine" class="log-filter-label"></span>
                <div id="log-machines" class="log-chips"></div>
              </div>
            </div>
            <div id="log-body" class="log-body">
              <ol id="log" class="log" aria-live="polite"></ol>
              <p id="log-note" class="log-note"></p>
            </div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <!-- overlays -->
  <div id="overlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button id="overlay-close" class="sheet-close ghost" type="button" aria-label="Close">&#10005;</button>
      <div id="overlay-body"></div>
    </div>
  </div>

  <p id="message" class="message" role="status"></p>
  <noscript><p class="message">Packet Alley needs JavaScript and WebAssembly.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
